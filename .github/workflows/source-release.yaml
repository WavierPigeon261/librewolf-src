name: Create Source Code Release

on:
  workflow_dispatch:

jobs:
  build-source:
    runs-on: ubuntu-latest
    container:
      image: librewolf.dev/librewolf/bsys6:dind
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make LibreWolf source archive
        env:
          SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SIGNING_KEY || '' }}
        run: |
          make all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librewolf-source
          path: |
            librewolf-*.source.tar.gz
            librewolf-*.source.tar.gz.sha256sum
            librewolf-*.source.tar.gz.sha512sum
            librewolf-*.source.tar.gz.sig
            patchfail-fuzz.out
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    container:
      image: librewolf.dev/librewolf/bsys6:release
    needs: [build-source]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: librewolf-source

      - name: Set variables
        id: version
        run: |
          echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT
          echo "RELEASE=$(cat release)" >> $GITHUB_OUTPUT
          echo "BUILD_JOB_ID=$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(cat version)-$(cat release)"
          
          # Find generated files
          FILES=(
            librewolf-${TAG}.source.tar.gz
            librewolf-${TAG}.source.tar.gz.sha256sum
            librewolf-${TAG}.source.tar.gz.sha512sum
          )
          
          if [ -f "librewolf-${TAG}.source.tar.gz.sig" ]; then
            FILES+=("librewolf-${TAG}.source.tar.gz.sig")
          fi

          # Create GitHub Release directly using gh CLI
          gh release create "v${TAG}" "${FILES[@]}" \
            --title "LibreWolf Source v${TAG}" \
            --notes "## LibreWolf Source Release v${TAG}
            Built by workflow [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
